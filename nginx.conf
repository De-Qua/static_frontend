server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Static files are used by other domains (web app, Cordova app): allow cross-origin requests
    add_header Access-Control-Allow-Origin * always;

    location / {
        # No SPA fallback: a missing file must return 404
        try_files $uri =404;
    }

    # JSON files (app version, translations, default options) must always be fresh
    location ~* \.json$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Access-Control-Allow-Origin * always;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}